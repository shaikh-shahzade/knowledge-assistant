spring.application.name=assistance-app
spring.profiles.active=dev
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assistance-app?options=-c%20TimeZone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
# spring.ai.openai.api-key=${OPENAI_API_KEY:MyKey}

# # Chat Model
# spring.ai.openai.chat.options.model=gpt-4o-mini
# spring.ai.openai.chat.options.temperature=0.7

# # Embedding Model
# spring.ai.openai.embedding.options.model=text-embedding-3-small

#pgvector
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.max-document-batch-size=1000


logging.level.org.springframework.ai=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate.SQL=INFO

# Swagger 
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
